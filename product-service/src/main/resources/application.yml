spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/flashsale
    username: postgres
    password: postgreSQL12345
    driver-class-name: org.postgresql.Driver
#  data:
#    redis:
#      host: localhost
#      port: 6379

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  cache:
    type: redis

  kafka:
    bootstrap-servers: kafka:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        # Publish stable event-name tokens instead of Java class names.
        spring.json.add.type.headers: true
        spring.json.type.mapping: >
          stock-decrement:com.syamsundar.product_service.messaging.dto.StockDecrementEvent,
          stock-reserved:com.syamsundar.product_service.kafka.event.StockReservedEvent
    consumer:
      group-id: product-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.syamsundar.product_service.*
        spring.json.use.type.headers: true
        spring.json.type.mapping: >
          stock-decrement:com.syamsundar.product_service.messaging.dto.StockDecrementEvent

logging:
  level:
    org.springframework.cache: TRACE
    org.springframework.data.redis: DEBUG
